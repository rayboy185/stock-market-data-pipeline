services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: raywelcome
      POSTGRES_DB: ai_stocks
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_stocks"]
      interval: 5s
      timeout: 5s
      retries: 5

  extractor:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy

  dbt:
    build:
      context: ./transform
      dockerfile: Dockerfile
    depends_on:
      extractor:
        condition: service_completed_successfully

volumes:
  pgdata: